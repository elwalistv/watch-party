<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Stream - elwalis.com</title>
  
  <!-- SDK del Reproductor de Amazon IVS -->
  <script src="https://live-video.net"></script>

  <!-- Importar Fuentes de Íconos (FontAwesome para el logo de Twitch y Kick) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .layout-container {
      display: flex;
      flex-wrap: wrap;
      height: 100vh;
    }
    .main-content {
      flex: 3;
      display: flex;
      flex-direction: column;
      min-width: 300px;
    }
    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    video {
      width: 100%;
      height: 100%;
    }
    .social-links {
      padding: 20px;
      background: #18181c;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .social-btn {
      padding: 10px 20px;
      border-radius: 8px; /* Esquinas más redondeadas */
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px; /* Espacio entre ícono y texto */
      font-size: 16px;
      transition: transform 0.2s; /* Pequeña animación al pasar el mouse */
    }
    .social-btn:hover {
      transform: translateY(-2px); /* Efecto de elevación */
    }

    /* Estilo Botón Kick (Verde Neón) */
    .btn-kick { 
      background-color: #53fc18; 
      color: #000; 
    }

    /* Estilo Botón Twitch (Morado) */
    .btn-twitch { 
      background-color: #9146FF; 
      color: #fff; 
    }
    
    /* Estilo Botón Twitter (Azul) */
    .btn-twitter { 
      background-color: #1da1f2; 
      color: #fff; 
    }

    .chat-container {
      flex: 1;
      min-width: 340px;
      border-left: 1px solid #2d2d34;
      background: #19191c;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="layout-container">
    <!-- Sección Izquierda: Video + Redes -->
    <div class="main-content">
      <div class="video-container">
        <video id="video-player" controls playsinline></video>
      </div>
      <div class="social-links">
        <!-- BOTÓN KICK: Se agregó la clase .btn-kick y el ícono de FontAwesome -->
        <a href="https://kick.com/TU_USUARIO" target="_blank" class="social-btn btn-kick">
          <i class="fa-solid fa-k"></i> Suscribirse
        </a>
        
        <!-- BOTÓN TWITCH: Se agregó la clase .btn-twitch y el ícono de FontAwesome -->
        <a href="https://twitch.tv/TU_USUARIO" target="_blank" class="social-btn btn-twitch">
          <i class="fa-brands fa-twitch"></i> Suscribirse
        </a>

        <!-- BOTÓN TWITTER: Se mantuvo el estilo previo pero se mejoró con la clase .social-btn -->
        <a href="https://x.com/TU_USUARIO" target="_blank" class="social-btn btn-twitter">
          <i class="fa-brands fa-twitter"></i> Síguenos
        </a>
      </div>
    </div>

    <!-- Sección Derecha: Chat Incrustado de Kick -->
    <div class="chat-container">
      <iframe src="https://kick.com/popout/TU_USUARIO/chat"></iframe>
    </div>
  </div>

  <script>
    (function() {
      if (!IVSPlayer.isPlayerSupported) {
        console.error("El reproductor de Amazon IVS no es compatible con este navegador.");
        return;
      }
      const player = IVSPlayer.create();
      player.attachHTMLVideoElement(document.getElementById('video-player'));
      
      // --- RECUERDA EDITAR AQUÍ CON TU URL DE AWS IVS ---
      const playbackUrl = "https://TU_ID_PLAYBACK.codes.us-east-1.playback.live-video.net/api/video/v1/us-east-1.CUENTA.channel.M3U8_ID.m3u8";
      
      player.load(playbackUrl);
      player.play();
    })();
  </script>

</body>
</html>
