<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - ElWalis</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            width: 100%;
            max-width: 1600px;
            height: 90vh;
            max-height: 900px;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }

        .video-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Barra de controles flotante personalizada sobre el video */
        .custom-controls {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        .ctrl-btn {
            background: #27272a;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .ctrl-btn:hover {
            background: #3f3f46;
        }

        .social-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            padding: 12px 20px;
            background-color: #161618;
            border-radius: 10px;
            border: 1px solid #27272a;
        }

        .social-bar span {
            font-weight: bold;
            font-size: 14px;
            color: #a1a1aa;
        }

        .social-btn {
            background-color: #27272a;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .social-btn:hover {
            background-color: #3f3f46;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            background-color: #161618;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #27272a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background-color: #161618;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            .chat-container {
                height: 500px;
            }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- SECCIÓN IZQUIERDA: Reproductor y Redes -->
        <div class="left-column">
            <div class="video-container" id="videoBox">
                <!-- Reproductor principal de Kick configurado con controles nativos visibles -->
                <iframe 
                    id="kickPlayer"
                    src="https://player.kick.com/eltopo12345?autoplay=true&muted=false" 
                    title="Watch Party Stream" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>

                <!-- Botones de control rápido flotantes (Pantalla Completa) -->
                <div class="custom-controls">
                    <button class="ctrl-btn" onclick="toggleFullscreen()">⛶ Pantalla Completa</button>
                </div>
            </div>

            <div class="social-bar">
                <span>REDES:</span>
                <a href="https://kick.com/eltopo12345" target="_blank" class="social-btn">Kick</a>
                <a href="https://twitter.com/TuUsuario" target="_blank" class="social-btn">Twitter / X</a>
                <a href="https://discord.gg/TuDiscord" target="_blank" class="social-btn">Discord</a>
            </div>
        </div>

        <!-- SECCIÓN DERECHA: Chat -->
        <div class="chat-container">
            <iframe src="https://kick.com/popout/eltopo12345/chat" title="Chat de Kick"></iframe>
        </div>

    </div>

    <script>
        // Función para activar la pantalla completa de todo el contenedor de video
        function toggleFullscreen() {
            var elem = document.getElementById("videoBox");
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
