<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No se puede acceder a este sitio web</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #202124;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      min-height: 100vh;
    }
    .error-container {
      max-width: 600px;
      margin-top: 20px;
    }
    .icon-offline {
      width: 48px;
      height: 48px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 10px;
    }
    .domain {
      font-weight: 600;
    }
    p {
      color: #5f6368;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    ul {
      color: #5f6368;
      font-size: 0.875rem;
      padding-left: 20px;
      margin-bottom: 20px;
    }
    li {
      margin-bottom: 6px;
    }
    .error-code {
      color: #5f6368;
      font-size: 0.75rem;
    }
    .btn-reload {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 8px 24px;
      font-size: 0.875rem;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-reload:hover {
      background-color: #1b66c9;
    }
    #live-layout {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #09090b;
      z-index: 9999;
    }
    /* Recorte para ocultar el nombre y bloqueo absoluto de clics en el video */
    .player-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .player-wrapper iframe {
      position: absolute;
      top: -65px;
      left: 0;
      width: 100%;
      height: calc(100% + 65px);
      border: 0;
      /* ESTO BLOQUEA CUALQUIER CLIC O INTENTO DE SALIR A KICK DESDE EL REPRODUCTOR */
      pointer-events: none; 
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

  <!-- PANTALLA DE ERROR ESTILO JIVEN (Se muestra cuando estás APAGADO) -->
  <div class="error-container" id="offline-screen">
    <svg class="icon-offline" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="9" y1="15" x2="9" y2="15"></line>
      <line x1="15" y1="15" x2="15" y2="15"></line>
      <path d="M9 18c.5 1 1.5 1.5 3 1.5s2.5-.5 3-1.5"></path>
    </svg>

    <h1>No se puede acceder a este sitio web</h1>
    <p><span class="domain" id="current-domain">elwalis.com</span> ha tardado demasiado en responder.</p>
    
    <p>Prueba a:</p>
    <ul>
      <li>Comprobar la conexión</li>
      <li>Comprobar el proxy y el cortafuegos</li>
      <li>Ejecutar Diagnósticos de red de Windows</li>
    </ul>

    <div class="error-code">ERR_CONNECTION_TIMED_OUT</div>

    <button class="btn-reload" onclick="location.reload()">Volver a cargar</button>
  </div>

  <!-- PANTALLA EN VIVO -->
  <div id="live-layout">
    <div class="flex flex-col h-screen overflow-hidden w-full">
      
      <header class="bg-zinc-900 border-b border-zinc-800 p-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
          <h1 class="font-bold text-lg tracking-wide text-white">ELWALIS.COM</h1>
        </div>
        <div class="text-xs text-zinc-400">Transmisión en vivo</div>
      </header>

      <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <main class="flex-1 bg-black flex items-center justify-center relative p-2">
          
          <div class="player-wrapper">
            <iframe src="https://player.kick.com/eltopo12345" allowfullscreen></iframe>
          </div>

        </main>
        
        <aside class="w-full md:w-80 h-64 md:h-full bg-zinc-900 border-l border-zinc-800">
          <iframe src="https://kick.com/popout/elwalis/chat" class="w-full h-full border-0"></iframe>
        </aside>
      </div>

    </div>
  </div>

  <!-- SCRIPT DE DETECCIÓN -->
  <script>
    document.getElementById('current-domain').innerText = window.location.hostname;

    const CHANNEL_NAME = 'eltopo12345';
    const liveLayout = document.getElementById('live-layout');
    const offlineScreen = document.getElementById('offline-screen');

    async function checkStreamStatus() {
      try {
        const response = await fetch(`https://kick.com/api/v2/channels/${CHANNEL_NAME}`);
        const data = await response.json();

        if (data && data.livestream !== null) {
          offlineScreen.style.display = 'none';
          liveLayout.style.display = 'block';
        } else {
          liveLayout.style.display = 'none';
          offlineScreen.style.display = 'block';
        }
      } catch (error) {
        console.error('Error al verificar el estado:', error);
      }
    }

    checkStreamStatus();
    setInterval(checkStreamStatus, 30000);
  </script>

</body>
</html>
