<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - ElWalis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Contenedor principal en cuadrícula (Video a la izquierda, Chat a la derecha) */
        .wrapper {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 15px;
            width: 95vw;
            height: 90vh;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        /* Contenedor del video donde aplicamos el recorte de logos */
        .video-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #000;
            border-radius: 12px;
            overflow: hidden; /* Oculta el logo de Kick y los botones externos */
        }

        /* Zoom ligero para cortar los bordes no deseados */
        #kick-iframe {
            position: absolute;
            top: -2%;
            left: -2%;
            width: 104%;
            height: 104%;
            border: 0;
        }

        /* ESCUDOS ANTIRREDIRECCIÓN ESTRATÉGICOS PARA PC */
        /* Bloquea toda la parte superior (logos y nombres de Kick) */
        .blocker-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80%;
            background: transparent;
            z-index: 5;
            pointer-events: auto;
        }

        /* Bloquea solo la parte derecha de la barra inferior (evita el botón de "Visit Kick for HD") */
        .blocker-bottom-right {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 45%;
            height: 20%;
            background: transparent;
            z-index: 5;
            pointer-events: auto;
        }

        /* Bloquea la parte izquierda extrema inferior, dejando libre únicamente el área del volumen */
        .blocker-bottom-left {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 30%;
            height: 20%;
            background: transparent;
            z-index: 5;
            pointer-events: auto;
        }

        /* Barra de controles flotante personalizada (Volumen rápido y Pantalla Completa) */
        .custom-controls {
            position: absolute;
            bottom: 12px;
            right: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 20;
        }

        .ctrl-btn {
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(40, 40, 40, 0.95);
        }

        /* Contenedor del Chat a la derecha */
        .chat-container {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
        }

        #chat-iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Diseño responsivo para celulares */
        @media (max-width: 900px) {
            .wrapper { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Columna Izquierda: Video + Controles flotantes -->
        <div class="left-column">
            <div class="video-container" id="videoBox">
                <!-- REEMPLAZA "eltopo12345" POR TU USUARIO REAL DE KICK -->
                <iframe 
                    id="kick-iframe"
                    src="https://player.kick.com/eltopo12345?autoplay=true&muted=false" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
                
                <!-- Escudos que evitan redirecciones pero dejan libre la zona de audio -->
                <div class="blocker-top"></div>
                <div class="blocker-bottom-right"></div>
                <div class="blocker-bottom-left"></div>

                <!-- Botones flotantes de control para PC -->
                <div class="custom-controls">
                    <button class="ctrl-btn" onclick="toggleMute()">🔊 Silenciar / Audio</button>
                    <button class="ctrl-btn" onclick="toggleFullscreen()">⛶ Pantalla Completa</button>
                </div>
            </div>
        </div>

        <!-- Columna Derecha: Chat oficial de Kick en modo Popout -->
        <div class="chat-container">
            <!-- REEMPLAZA "eltopo12345" AQUÍ TAMBIÉN -->
            <iframe id="chat-iframe" src="https://kick.com/popout/eltopo12345/chat"></iframe>
        </div>
    </div>

    <script>
        // Función rápida para alternar pantalla completa
        function toggleFullscreen() {
            var elem = document.getElementById("videoBox");
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Función de seguridad por si el audio requiere un reintento de interacción limpia
        function toggleMute() {
            var iframe = document.getElementById("kick-iframe");
            // Recarga rápida de sincronización de audio si algún navegador bloquea el estado inicial
            iframe.src = iframe.src;
        }
    </script>

</body>
</html>
