<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Walis - Live Watch Party</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #121212; }
        #video-container { width: 100%; height: 100%; position: relative; }
        
        /* Contenedor del Iframe */
        iframe { width: 100%; height: 100%; border: none; }

        /* Pantalla de error (se muestra si no carga el video) */
        #error-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f1f1f1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-family: sans-serif;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <!-- PANTALLA DE ERROR: Se muestra si Rumble no carga -->
        <div id="error-screen">
            <h1 style="color: #333;">⚠️ Error de conexión</h1>
            <p>La página <b>rumble.com</b> ha rechazado la conexión.</p>
        </div>

        <!-- REPRODUCTOR RUMBLE: Cambia el ID del src por el tuyo -->
        <iframe 
            src="https://rumble.com/embed/vxxxxxx/?pub=4" 
            allowfullscreen 
            scrolling="no" 
            frameborder="0">
        </iframe>
    </div>

</body>
</html>
