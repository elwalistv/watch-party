<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elwalis.com - Watch Party</title>
    
    <!-- 1. Estilos y librería de Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <!-- 2. Amazon IVS Player Tech para Video.js -->
    <script src="https://player.live-video.net/1.24.0/amazon-ivs-videojs-tech.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0e0e10;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-banner {
            background: #18181b;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2f2f35;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 30;
        }
        .top-banner span {
            color: #ff75e6;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            flex: 1;
            height: calc(100vh - 105px);
            width: 100vw;
        }

        .video-section {
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Estilos para adaptar Video.js al diseño oscuro tipo streaming */
        .video-js {
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        .video-js .vjs-big-play-button {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.7);
            border-color: #53fc18;
            border-radius: 50%;
            width.
            height: 60px;
            width: 60px;
        }
        .vjs-theme-city .vjs-control-bar {
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
        }

        .video-overlay-bottom-left {
            position: absolute;
            bottom: 60px;
            left: 30px;
            color: #ff75e6;
            font-weight: 900;
            font-size: 22px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 5;
            line-height: 1.2;
        }

        .floating-cam {
            position: absolute;
            bottom: 60px;
            right: 30px;
            width: 260px;
            aspect-ratio: 16/9;
            background: #18181b;
            border: 2px solid #53fc18;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .floating-cam span {
            font-size: 13px;
            color: #efeff1;
            background: rgba(0, 0, 0, 0.75);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .chat-section {
            background: #18181b;
            border-left: 1px solid #2f2f35;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-header {
            padding: 12px 16px;
            font-weight: 700;
            font-size: 14px;
            border-bottom: 1px solid #2f2f35;
            background: #1f1f23;
            color: #efeff1;
            text-align: center;
        }
        .chat-frame-container {
            flex: 1;
            width: 100%;
            background: #0e0e10;
        }
        .chat-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer-buttons-bar {
            height: 45px;
            background: #09090b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-top: 1px solid #2f2f35;
            z-index: 30;
            padding: 0 15px;
        }
        .btn-link {
            background: #1f1f23;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #2f2f35;
            transition: background 0.2s;
        }
        .btn-link:hover {
            background: #2f2f35;
        }
        .btn-youtube { background: #ff0000; border-color: #ff0000; }
        .btn-kick { background: #53fc18; color: #000; border-color: #53fc18; font-weight: 700; }
        .btn-patreon { background: #ff424d; border-color: #ff424d; }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                grid-template-rows: 55vh 1fr;
            }
            .floating-cam {
                width: 130px;
                bottom: 50px;
                right: 15px;
            }
            .video-overlay-bottom-left { font-size: 14px; bottom: 50px; left: 15px; }
        }
    </style>
</head>
<body>

    <div class="top-banner">
        <span>🎬</span> 12 SUBS KICK = VEMOS HOY MILES MORALES 1 0/12
    </div>

    <div class="main-layout">
        
        <div class="video-section">
            <!-- Reproductor Video.js configurado con soporte IVS -->
            <video-js id="amazon-ivs-player" class="vjs-default-skin vjs-big-play-centered" controls preload="auto" playsinline>
                <source src="https://7c37b557078d.us-east-1.playback.live-video.net/api/video/v1/us-east-1.885191629510.channel.LV8ooIxv5Uqu.m3u8" type="application/x-mpegURL" />
            </video-js>

            <div class="video-overlay-bottom-left">
                12 SUBS KICK = VEMOS HOY MILES MORALES 1 0/12
            </div>

            <div class="floating-cam">
                <span>Tu Cámara</span>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header">Chat</div>
            <div class="chat-frame-container">
                <iframe src="https://kick.com/popout/elwalistv/chat" title="Chat en vivo"></iframe>
            </div>
        </div>

    </div>

    <div class="footer-buttons-bar">
        <a href="https://youtube.com" target="_blank" class="btn-link btn-youtube">YouTube</a>
        <a href="https://kick.com" target="_blank" class="btn-link btn-kick">Suscribirse (Kick)</a>
        <a href="https://patreon.com" target="_blank" class="btn-link btn-patreon">Patreon</a>
    </div>

    <script>
        // Inicializar Video.js usando la tecnología de Amazon IVS
        document.addEventListener("DOMContentLoaded", () => {
            registerIVSTech(videojs);
            
            const player = videojs('amazon-ivs-player', {
                techOrder: ["AmazonIVS"],
                autoplay: true,
                muted: false,
                liveui: true
            });

            player.ready(() => {
                console.log("Reproductor IVS con Video.js listo.");
            });
        });
    </script>
</body>
</html>
