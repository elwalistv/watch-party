<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - ElWalis</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Estructura general de la Watch Party */
        .jivencio-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 15px;
            width: 100%;
            max-width: 1600px;
            height: 95vh;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .video-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background-color: #000000;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        #kick-iframe {
            position: absolute;
            top: -2%;
            left: -2%;
            width: 104%;
            height: 104%;
            border: 0;
        }

        /* Escudos antirredirección */
        .blocker-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80%;
            background: transparent;
            z-index: 5;
            pointer-events: auto;
        }

        .blocker-bottom-right {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 45%;
            height: 20%;
            background: transparent;
            z-index: 5;
            pointer-events: auto;
        }

        .blocker-bottom-left {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 30%;
            height: 20%;
            background: transparent;
            z-index: 5;
            pointer-events: auto;
        }

        .custom-controls {
            position: absolute;
            bottom: 12px;
            right: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 20;
        }

        .ctrl-btn {
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(40, 40, 40, 0.95);
        }

        /* Barra inferior de botones */
        .bottom-bar {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background-color: #141416;
            border-radius: 12px;
            border: 1px solid #222226;
        }

        .nav-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
        }

        .nav-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-youtube { background-color: #ff0000; }
        .btn-kick { background-color: #53fc18; color: #000; }
        .btn-patreon { background-color: #ff424d; }
        .btn-sub { background-color: #9146ff; }

        .chat-container {
            background-color: #141416;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #222226;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            height: 100%;
        }

        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background-color: #141416;
        }

        /* PANTALLA DE ERROR EXPANDIDA A TODA LA PANTALLA */
        #offline-screen {
            display: none; /* Oculto mientras hay stream */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            color: #202124;
            z-index: 9999;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            flex-direction: column;
            justify-content: center; /* Centrado vertical completo en toda la pantalla */
            align-items: flex-start;
            padding-left: 12vw; /* Amplitud general adaptada a todo el monitor */
            box-sizing: border-box;
        }

        .err-icon {
            width: 32px;
            height: 38px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="38"><path fill="%23757575" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>');
            background-repeat: no-repeat;
            margin-bottom: 24px;
        }

        .err-title {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 12px;
        }

        .err-url {
            font-weight: bold;
            color: #202124;
        }

        .err-desc {
            font-size: 13px;
            color: #5f6368;
            margin-top: 14px;
            line-height: 1.6;
        }

        .err-desc ul {
            margin: 4px 0 12px 18px;
            padding: 0;
        }

        .err-code {
            font-size: 11px;
            color: #5f6368;
            margin-top: 18px;
        }

        .err-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            align-items: center;
        }

        .err-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .err-btn:hover {
            background-color: #1b66c9;
        }

        .err-details-btn {
            background: transparent;
            color: #1a73e8;
            border: 1px solid #dadce0;
            padding: 7px 18px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
        }

        .err-details-btn:hover {
            background-color: rgba(26, 115, 232, 0.04);
        }

        @media (max-width: 1024px) {
            .jivencio-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            .chat-container {
                height: 500px;
            }
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE ERROR EXPANDIDA A TODO EL ANCHO DE LA PANTALLA -->
    <div id="offline-screen">
        <div class="err-icon"></div>
        <div class="err-title">No se puede acceder a este sitio web</div>
        <div><span id="current-domain" class="err-url">watch.jivensensei.com</span> ha tardado demasiado en responder.</div>
        <div class="err-desc">
            Prueba a:
            <ul>
                <li>Comprobar la conexión</li>
                <li>Comprobar el proxy y el cortafuegos</li>
                <li>Ejecutar Diagnósticos de red de Windows</li>
            </ul>
        </div>
        <div class="err-code">ERR_CONNECTION_TIMED_OUT</div>
        <div class="err-actions">
            <button class="err-btn" onclick="location.reload()">Volver a cargar</button>
            <button class="err-details-btn">Detalles</button>
        </div>
    </div>

    <div class="jivencio-layout">
        
        <!-- SECCIÓN IZQUIERDA -->
        <div class="left-column">
            
            <div class="video-container" id="videoBox">
                <!-- REEMPLAZA "eltopo12345" POR TU USUARIO REAL DE KICK -->
                <iframe 
                    id="kick-iframe"
                    src="https://player.kick.com/eltopo12345?autoplay=true&muted=false" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
                
                <div class="blocker-top"></div>
                <div class="blocker-bottom-right"></div>
                <div class="blocker-bottom-left"></div>

                <div class="custom-controls">
                    <button class="ctrl-btn" onclick="toggleMute()">🔊 Audio</button>
                    <button class="ctrl-btn" onclick="toggleFullscreen()">⛶ Pantalla Completa</button>
                </div>
            </div>

            <!-- BARRA INFERIOR -->
            <div class="bottom-bar">
                <a href="https://youtube.com" target="_blank" class="nav-btn btn-youtube">YouTube</a>
                <a href="https://kick.com/eltopo12345" target="_blank" class="nav-btn btn-kick">Kick</a>
                <a href="https://patreon.com" target="_blank" class="nav-btn btn-patreon">Patreon</a>
                <a href="https://kick.com/eltopo12345" target="_blank" class="nav-btn btn-sub">Suscribirse</a>
            </div>

        </div>

        <!-- SECCIÓN DERECHA (Chat) -->
        <div class="chat-container">
            <iframe src="https://kick.com/popout/eltopo12345/chat" title="Chat"></iframe>
        </div>

    </div>

    <script>
        document.getElementById('current-domain').innerText = window.location.hostname;

        function toggleFullscreen() {
            var elem = document.getElementById("videoBox");
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function toggleMute() {
            var iframe = document.getElementById("kick-iframe");
            iframe.src = iframe.src;
        }

        // COMPROBADOR AUTOMÁTICO DE ESTADO DE STREAM
        async function checkStreamStatus() {
            const channelName = "eltopo12345"; // Reemplaza por tu usuario real de Kick
            try {
                const response = await fetch(`https://kick.com/api/v1/channels/${channelName}`);
                if (response.ok) {
                    const data = await response.json();
                    const screen = document.getElementById('offline-screen');
                    
                    if (!data.livestream) {
                        screen.style.display = 'flex';
                    } else {
                        screen.style.display = 'none';
                    }
                }
            } catch (error) {
                console.log("Comprobando estado...");
            }
        }

        setInterval(checkStreamStatus, 30000);
        checkStreamStatus();

        // Control manual con F8
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F8') {
                var screen = document.getElementById('offline-screen');
                screen.style.display = (screen.style.display === 'flex') ? 'none' : 'flex';
            }
        });
    </script>

</body>
</html>
