<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch Party - ElWalis</title>

    <link rel="stylesheet" href="style.css">

    <!-- Amazon IVS Web Player -->
    <script src="https://player.live-video.net/1.56.1/amazon-ivs-player.min.js"></script>
</head>

<body>

    <div class="app">

        <!-- =====================================
             HEADER
        ====================================== -->
        <header class="topbar">

            <div class="brand">
                <div class="brand-logo">
                    EW
                </div>

                <div class="brand-info">
                    <h1>ElWalis</h1>
                    <span>WATCH PARTY</span>
                </div>
            </div>

            <div class="live-status">
                <span class="live-dot"></span>
                EN VIVO
            </div>

        </header>


        <!-- =====================================
             CONTENIDO PRINCIPAL
        ====================================== -->
        <main class="main-content">

            <!-- =================================
                 VIDEO
            ================================== -->
            <section class="video-section">

                <div class="video-wrapper">

                    <video
                        id="video-player"
                        playsinline
                        controls
                        autoplay>
                    </video>

                    <!-- Overlay -->
                    <div id="loading-overlay" class="loading-overlay">

                        <div class="loader"></div>

                        <span>
                            Conectando al directo...
                        </span>

                    </div>

                </div>


                <!-- =================================
                     INFORMACIÓN DEL STREAM
                ================================== -->
                <div class="stream-info">

                    <div class="stream-title">

                        <span class="live-badge">
                            EN VIVO
                        </span>

                        <h2>
                            ElWalis Watch Party
                        </h2>

                    </div>

                    <div class="stream-description">
                        Disfruta del directo y comparte el momento con la comunidad.
                    </div>

                </div>

            </section>


            <!-- =================================
                 CHAT
            ================================== -->
            <aside class="chat-section">

                <div class="chat-header">

                    <div class="chat-title">

                        <span class="chat-icon">
                            💬
                        </span>

                        <span>
                            CHAT EN VIVO
                        </span>

                    </div>

                    <div class="chat-online">
                        ● LIVE
                    </div>

                </div>


                <div class="chat-container">

                    <iframe
                        src="https://kick.com/popout/elwalistv/chat"
                        frameborder="0"
                        scrolling="no"
                        allowfullscreen>
                    </iframe>

                </div>

            </aside>

        </main>


        <!-- =====================================
             FOOTER
        ====================================== -->
        <footer class="footer">

            <span>
                © 2026 ElWalis
            </span>

            <span>
                Watch Party
            </span>

        </footer>

    </div>


    <!-- =========================================
         AMAZON IVS
    ========================================== -->
    <script>

        const PLAYBACK_URL =
            "https://7c37b557078d.us-east-1.playback.live-video.net/api/video/v1/us-east-1.885191629510.channel.4hpYAizRvJeM.m3u8";


        const video =
            document.getElementById("video-player");


        const loadingOverlay =
            document.getElementById("loading-overlay");


        /*
         * Comprobar compatibilidad
         */
        if (IVSPlayer.isPlayerSupported) {

            const player =
                IVSPlayer.create();


            /*
             * Conectar IVS con nuestro <video>
             */
            player.attachHTMLVideoElement(video);


            /*
             * Cargar stream
             */
            player.load(PLAYBACK_URL);


            /*
             * Intentar reproducir
             */
            player.play().catch((error) => {

                console.log(
                    "El navegador bloqueó el autoplay.",
                    error
                );

            });


            /*
             * STREAM LISTO
             */
            player.addEventListener(
                IVSPlayer.PlayerState.READY,
                () => {

                    console.log(
                        "Amazon IVS listo."
                    );

                }
            );


            /*
             * STREAM REPRODUCIÉNDOSE
             */
            player.addEventListener(
                IVSPlayer.PlayerState.PLAYING,
                () => {

                    console.log(
                        "Stream reproduciéndose."
                    );

                    loadingOverlay.classList.add(
                        "hidden"
                    );

                }
            );


            /*
             * BUFFERING
             */
            player.addEventListener(
                IVSPlayer.PlayerState.BUFFERING,
                () => {

                    console.log(
                        "Buffering..."
                    );

                }
            );


            /*
             * ERROR
             */
            player.addEventListener(
                IVSPlayer.PlayerEventType.ERROR,
                (error) => {

                    console.error(
                        "Error Amazon IVS:",
                        error
                    );

                    loadingOverlay.classList.remove(
                        "hidden"
                    );

                }
            );


        } else {

            console.error(
                "Este navegador no soporta Amazon IVS."
            );

        }

    </script>

</body>
</html>
