<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - ElWalis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- Contenedor del Reproductor de Video -->
        <div class="video-section">
            <div class="video-container">
                <!-- Reproductor oficial de Kick -->
                <iframe src="https://player.kick.com/elwalistv" 
                        height="100%" 
                        width="100%" 
                        frameborder="0" 
                        scrolling="no" 
                        allowfullscreen="true">
                </iframe>
            </div>
            
            <!-- Barra de botones para cambiar de plataforma -->
            <div class="platform-bar">
                <button class="btn-platform yt">YouTube</button>
                <button class="btn-platform kick active">Kick</button>
                <button class="btn-platform rumble">Rumble</button>
            </div>
        </div>

        <!-- Contenedor del Chat -->
        <div class="chat-section">
            <!-- Chat oficial en Modo Popout de Kick -->
            <iframe src="https://kick.com/popout/elwalistv/chat" 
                    height="100%" 
                    width="100%" 
                    frameborder="0">
            </iframe>
        </div>
    </div>
</body>
</html>
