<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party Minimalista</title>
    <style>
        /* ESTILOS CSS: Hacen que el reproductor se vea limpio y flexible */
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Fondo negro para evitar destellos blancos */
            overflow: hidden; /* Evita barras de desplazamiento */
            height: 100vh;
        }

        /* Contenedor principal del video */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh; /* Ocupa toda la pantalla */
            overflow: hidden;
        }

        /* El iframe de YouTube */
        #yt-player {
            position: absolute;
            /* Truco para ocultar la barra de título superior de YouTube:
               Hacemos el video más grande y lo subimos 50px. */
            top: -50px;
            left: 0;
            width: 100%;
            height: calc(100% + 100px); /* Aumenta la altura para compensar el corte */
            pointer-events: auto; /* Necesario para que el reproductor funcione */
        }

        /* LA CAPA MÁGICA DE BLOQUEO:
           Esta capa invisible se pone ENCIMA del video.
           Impide que el usuario mueva el mouse sobre YouTube y que aparezcan los controles. */
        .mouse-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent; /* Es completamente transparente */
            pointer-events: auto; /* Bloquea el mouse para que no llegue al reproductor */
            z-index: 10; /* Asegura que esté por encima del video */
        }
    </style>
</head>
<body>

    <!-- EL REPRODUCTOR -->
    <div class="video-container">
        <!-- Aquí se cargará el video de YouTube por medio de JavaScript -->
        <div id="yt-player"></div>
        
        <!-- Esta capa invisible bloquea los controles de YouTube -->
        <div class="mouse-blocker"></div>
    </div>

    <!-- CÓDIGO JAVASCRIPT: Controla el reproductor y aplica el diseño de Jivencio -->
    <script>
        // --- CONFIGURACIÓN ---
        // Pega AQUÍ tu ID de video de YouTube (el que sacaste de la barra de direcciones)
        var myVideoId = 'eUlnicOwdc4'; 
        // ---------------------

        // Carga la API de YouTube asíncronamente
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;

        // Esta función se ejecuta cuando la API de YouTube está lista
        function onYouTubeIframeApiReady() {
            player = new YT.Player('yt-player', {
                videoId: myVideoId,
                playerVars: {
                    'autoplay': 1,           // Auto reproducir
                    'controls': 0,           // Ocultar controles nativos
                    'showinfo': 0,           // Ocultar información del video
                    'modestbranding': 1,     // Marca mínima de YT
                    'rel': 0,                // No mostrar videos relacionados al final
                    'loop': 1,               // Bucle (repetir video)
                    'playlist': myVideoId,   // Necesario para el loop
                    'iv_load_policy': 3      // Ocultar anotaciones
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // Cuando el reproductor está listo
        function onPlayerReady(event) {
            // IMPORTANTE: Silencia el video al principio para garantizar que
            // el navegador permita la reproducción automática (autoplay).
            event.target.mute(); 
            event.target.playVideo();
            
            // Si quieres que el video tenga sonido, tendrás que notificar a los
            // usuarios que hagan un clic inicial en la página para activar el audio.
        }

        // Asegura que el video siga en bucle si termina
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                player.playVideo();
            }
        }
    </script>

</body>
</html>
