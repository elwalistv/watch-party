<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Walis - Live Watch Party</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #121212; 
        }
        
        #video-container { 
            width: 100%; 
            height: 100%; 
            position: relative; 
        }
        
        /* Reproductor de Rumble incrustado */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
        }

        /* Pantalla de error falsa (se muestra de fondo o si llega a fallar) */
        #error-screen {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-color: #f1f1f1; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            font-family: sans-serif;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <!-- PANTALLA DE ERROR: Simula el bloqueo de Chrome -->
        <div id="error-screen">
            <h1 style="color: #333; margin-bottom: 5px;">⚠️ Error de conexión</h1>
            <p style="color: #666;">La página <b>rumble.com</b> ha rechazado la conexión.</p>
        </div>

        <!-- REPRODUCTOR OFICIAL DE RUMBLE CON TU ENLACE -->
        <iframe 
            src="https://rumble.com/embed/v7eg998/" 
            allowfullscreen 
            scrolling="no" 
            frameborder="0">
        </iframe>
    </div>

</body>
</html>
