<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELWALIS.COM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans flex flex-col h-screen overflow-hidden">

  <!-- CABECERA DE LA PÁGINA -->
  <header class="bg-zinc-900 border-b border-zinc-800 p-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
      <h1 class="font-bold text-lg tracking-wide">ELWALIS.COM</h1>
    </div>
    <div class="text-xs text-zinc-400">
      Transmisión en vivo
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL (VIDEO + CHAT) -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden">

    <!-- ÁREA DE VIDEO PRINCIPAL -->
    <main class="flex-1 bg-black flex items-center justify-center relative p-2">
      
      <!-- Contenedor del video (Se oculta si no estás EN VIVO) -->
      <div id="stream-container" class="hidden relative w-full h-full rounded-lg overflow-hidden">
        <iframe
          src="https://player.kick.com/eltopo12345"
          class="w-full h-full border-0"
          allowfullscreen>
        </iframe>

        <!-- Capas invisibles que bloquean clics para no redirigir a Kick -->
        <div class="absolute top-0 right-0 w-72 h-16 bg-transparent z-10"></div>
        <div class="absolute bottom-0 right-12 w-52 h-10 bg-transparent z-10"></div>
      </div>

      <!-- Mensaje cuando el directo está APAGADO -->
      <div id="offline-message" class="flex flex-col items-center justify-center text-center p-6">
        <div class="w-12 h-12 mb-3 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
        </div>
        <h2 class="text-lg font-bold">El directo ha finalizado</h2>
        <p class="text-sm text-zinc-400 max-w-sm mt-1">La transmisión no está disponible. El reproductor volverá automáticamente cuando volvamos a estar en vivo.</p>
      </div>

    </main>

    <!-- COLUMNA DERECHA: CHAT DE TU CANAL PRINCIPAL -->
    <aside class="w-full md:w-80 h-64 md:h-full bg-zinc-900 border-l border-zinc-800">
      <iframe
        src="https://kick.com/popout/elwalis/chat"
        class="w-full h-full border-0">
      </iframe>
    </aside>

  </div>

  <!-- SCRIPT DE DETECCIÓN AUTOMÁTICA -->
  <script>
    const CHANNEL_NAME = 'eltopo12345';
    const streamContainer = document.getElementById('stream-container');
    const offlineMessage = document.getElementById('offline-message');

    async function checkStreamStatus() {
      try {
        const response = await fetch(`https://kick.com/api/v2/channels/${CHANNEL_NAME}`);
        const data = await response.json();

        if (data && data.livestream !== null) {
          streamContainer.classList.remove('hidden');
          offlineMessage.classList.add('hidden');
        } else {
          streamContainer.classList.add('hidden');
          offlineMessage.classList.remove('hidden');
        }
      } catch (error) {
        console.error('Error al verificar el estado del directo:', error);
      }
    }

    checkStreamStatus();
    setInterval(checkStreamStatus, 30000);
  </script>

</body>
</html>
