<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party ElWalis</title>
    <style>
        /* Fondo general de la página en negro */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Contenedor 16:9 estricto para asegurar que el video siempre tenga dimensiones */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 1280px; /* Ancho máximo para que no se deforme en pantallas gigantes */
            aspect-ratio: 16 / 9; /* Mantiene la proporción perfecta de video */
            background-color: #000;
            overflow: hidden;
            border-radius: 12px;
        }

        /* El reproductor se estira dentro del contenedor seguro */
        #yt-player {
            position: absolute;
            top: -10%;
            left: 0;
            width: 100%;
            height: 120%; /* Ampliado para recortar los bordes de YouTube */
            border: none;
        }

        /* Capa invisible que bloquea el mouse para que nadie toque los controles de YouTube */
        .mouse-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Aquí la API inyectará el video -->
        <div id="yt-player"></div>
        <!-- Capa anti-interacción -->
        <div class="mouse-blocker"></div>
    </div>

    <!-- SCRIPT DE LA API DE YOUTUBE -->
    <script>
        // Tu ID de transmisión actual
        var myVideoId = 'eUlnicOwdc4'; 

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;

        function onYouTubeIframeApiReady() {
            player = new YT.Player('yt-player', {
                videoId: myVideoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'showinfo': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'loop': 1,
                    'playlist': myVideoId,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.mute(); // Silenciado obligatorio para garantizar autoplay limpio
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                player.playVideo();
            }
        }
    </script>

</body>
</html>
