<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party ElWalis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor estricto 16:9 */
        .kick-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            overflow: hidden; /* Esto es clave: corta todo lo que salga del cuadro */
            border-radius: 12px;
        }

        /* Truco de zoom: Hacemos el reproductor más grande (104%) y lo centramos. 
           Esto saca de la pantalla el logo de Kick, el nombre y el botón de la esquina. */
        .kick-container iframe {
            position: absolute;
            top: -2%;
            left: -2%;
            width: 104%;
            height: 104%;
            border: 0;
        }

        /* Capa invisible que bloquea el mouse para que nadie pueda hacer clic ni ser redirigido a Kick */
        .mouse-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
            pointer-events: auto; /* Bloquea cualquier intento de clic en el reproductor */
        }
    </style>
</head>
<body>

    <div class="kick-container">
        <!-- Reemplaza "eltopo12345" por tu canal real de Kick -->
        <iframe 
            src="https://player.kick.com/eltopo12345?autoplay=true&muted=false" 
            title="Watch Party" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
        <!-- Escudo anti-clics y anti-redirecciones -->
        <div class="mouse-blocker"></div>
    </div>

</body>
</html>
