<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - ElWalis</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería HLS.js para el reproductor de Amazon IVS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <!-- Pantalla de Stream Finalizado -->
    <div id="offline-screen" class="offline-container" style="display: none;">
        <div class="offline-content">
            <h1>🔴 Stream Finalizado</h1>
            <p>El directo ha terminado por ahora. ¡Gracias por acompañarnos!</p>
        </div>
    </div>

    <div class="main-container" id="main-content">
        <!-- Sección Izquierda: Reproductor y Barra de Botones -->
        <div class="video-section">
            <div class="video-container">
                <video id="video-player" controls autoplay playsinline width="100%" height="100%"></video>
            </div>
            
            <!-- (Punto 4) Barra de botones inferior exacta -->
            <div class="platform-bar">
                <button class="btn-platform yt">YouTube</button>
                <button class="btn-platform kick active">Kick</button>
                <button class="btn-platform patreon">Patreon</button>
            </div>
        </div>

        <!-- (Punto 5) Sección Derecha: Chat de Kick acoplado -->
        <div class="chat-section">
            <iframe src="https://kick.com/popout/elwalistv/chat" 
                    height="100%" 
                    width="100%" 
                    frameborder="0">
            </iframe>
        </div>
    </div>

    <script>
        // Reproductor de Amazon IVS
        const video = document.getElementById('video-player');
        const videoSrc = 'https://7c37b557078d.us-east-1.playback.live-video.net/api/video/v1/us-east-1.885191629510.channel.yIDkn5FisDxT.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(() => {
                    video.muted = true;
                    video.play();
                });
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }

        // Verificador de estado en directo de Kick
        async function checkStreamStatus() {
            try {
                const response = await fetch('https://kick.com/api/v2/channels/elwalistv');
                const data = await response.json();
                
                const isLive = data && data.livestream !== null;
                const offlineScreen = document.getElementById('offline-screen');
                const mainContent = document.getElementById('main-content');

                if (!isLive) {
                    offlineScreen.style.display = 'flex';
                    mainContent.style.display = 'none';
                    if (!video.paused) video.pause();
                } else {
                    offlineScreen.style.display = 'none';
                    mainContent.style.display = 'flex';
                }
            } catch (error) {
                console.error("No se pudo verificar el estado del stream", error);
            }
        }

        checkStreamStatus();
        setInterval(checkStreamStatus, 60000);
    </script>
</body>
</html>
