<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>elwalis.com - Transmisión en Vivo</title>
    <script src="https://player.live-video.net/1.24.0/amazon-ivs-player.min.js"></script>
    <style>
        body { background: #0e0e10; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #video-container { width: 80%; max-width: 960px; aspect-ratio: 16/9; background: #000; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="amazon-ivs-video" playsinline controls></video>
    </div>

    <script>
        if (IVISPlayer.isSupported) {
            const player = IVISPlayer.create();
            player.attachHTMLVideoElement(document.getElementById('amazon-ivs-video'));
            player.load("https://7c37b557078d.us-east-1.playback.live-video.net/api/video/v1/us-east-1.885191629510.channel.LV8ooIxv5Uqu.m3u8");
            player.play();
        }
    </script>
</body>
</html>
