<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELWALISTV - Watch Party</title>
  
  <!-- SDK del Reproductor de Amazon IVS -->
  <script src="https://live-video.net"></script>

  <!-- Importar Fuentes de Íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background-color: #0b0b0e;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- Barra Superior --- */
    .top-header {
      background-color: #0b0b0e;
      padding: 8px 15px;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #1f1f23;
    }
    .top-header span {
      color: #adadb8;
    }

    /* --- Contenedor Principal (Flexbox) --- */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 35px);
    }

    /* --- Columna Izquierda --- */
    .left-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #000;
      overflow: hidden;
    }

    .video-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Barra de Controles Inferior */
    .player-controls-bar {
      height: 45px;
      background-color: #0e0e10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-top: 1px solid #1f1f23;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .control-btn {
      color: #efeff1;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding: 0;
      transition: color 0.2s;
    }
    .control-btn:hover {
      color: #9146FF;
    }

    .live-indicator {
      background-color: #eb0400;
      color: white;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .volume-slider {
      width: 70px;
      cursor: pointer;
    }

    /* Fila de Redes Sociales */
    .social-links-row {
      background-color: #18181b;
      padding: 10px 15px;
      display: flex;
      gap: 12px;
      align-items: center;
      border-top: 1px solid #2d2d35;
    }

    .social-btn {
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .social-btn:hover {
      transform: translateY(-2px);
    }

    .btn-youtube { background-color: #ff0000; color: #fff; box-shadow: 0 0 8px rgba(255, 0, 0, 0.4); }
    .btn-kick { background-color: #53fc18; color: #000; box-shadow: 0 0 8px rgba(83, 252, 24, 0.4); }
    .btn-patreon { background-color: #ff424d; color: #fff; box-shadow: 0 0 8px rgba(255, 66, 77, 0.4); }
    .btn-twitch { background-color: #9146FF; color: #fff; box-shadow: 0 0 8px rgba(145, 70, 255, 0.4); }

    /* --- Columna Derecha (Chat Fijo) --- */
    .right-column-chat {
      width: 340px;
      background-color: #18181b;
      border-left: 1px solid #2d2d35;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 10px 15px;
      background-color: #0e0e10;
      font-weight: bold;
      font-size: 13px;
      border-bottom: 1px solid #2d2d35;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <span>VIENDO:</span> ELWALISTV
  </div>

  <div class="app-container">
    
    <!-- COLUMNA IZQUIERDA -->
    <div class="left-column">
      
      <div class="video-container">
        <video id="video-player" playsinline></video>
      </div>

      <div class="player-controls-bar">
        <div class="controls-group">
          <button class="control-btn" id="btn-play"><i class="fas fa-play" id="play-icon"></i></button>
          <button class="control-btn" id="btn-mute"><i class="fas fa-volume-up" id="mute-icon"></i></button>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.1" value="1">
          <span class="live-indicator">LIVE</span>
        </div>

        <div class="controls-group">
          <button class="control-btn" id="btn-chromecast"><i class="fab fa-chromecast"></i></button>
          <button class="control-btn" id="btn-fullscreen"><i class="fas fa-expand"></i></button>
        </div>
      </div>

      <div class="social-links-row">
        <a href="https://youtube.com/@ELWALISTV" target="_blank" class="social-btn btn-youtube">
          <i class="fa-brands fa-youtube"></i> YouTube
        </a>
        <a href="https://kick.com/ELWALISTV" target="_blank" class="social-btn btn-kick">
          <i class="fa-solid fa-k"></i> Suscribirse
        </a>
        <a href="https://patreon.com/ELWALISTV" target="_blank" class="social-btn btn-patreon">
          <i class="fa-brands fa-patreon"></i> Patreon
        </a>
        <a href="https://twitch.tv/ELWALISTV" target="_blank" class="social-btn btn-twitch">
          <i class="fa-brands fa-twitch"></i> Suscribirse <i class="fa-solid fa-video" style="font-size: 10px;"></i>
        </a>
      </div>

    </div>

    <!-- COLUMNA DERECHA -->
    <div class="right-column-chat">
      <div class="chat-header">
        <span>Chat</span>
        <i class="fa-solid fa-comments" style="color: #53fc18;"></i>
      </div>
      <iframe src="https://kick.com/popout/ELWALISTV/chat"></iframe>
    </div>

  </div>

  <script>
    (function() {
      if (!IVSPlayer.isPlayerSupported) return;

      const player = IVSPlayer.create();
      const videoElement = document.getElementById('video-player');
      player.attachHTMLVideoElement(videoElement);
      
      const playbackUrl = "https://TU_ID_PLAYBACK.codes.us-east-1.playback.live-video.net/api/video/v1/us-east-1.CUENTA.channel.M3U8_ID.m3u8";
      player.load(playbackUrl);
      player.play();

      const btnPlay = document.getElementById('btn-play');
      const playIcon = document.getElementById('play-icon');
      btnPlay.addEventListener('click', () => {
        if (player.isPlaying()) {
          player.pause();
          playIcon.classList.replace('fa-pause', 'fa-play');
        } else {
          player.play();
          playIcon.classList.replace('fa-play', 'fa-pause');
        }
      });

      const btnMute = document.getElementById('btn-mute');
      const muteIcon = document.getElementById('mute-icon');
      const volumeSlider = document.getElementById('volume-slider');
      
      btnMute.addEventListener('click', () => {
        const isMuted = player.isMuted();
        player.setMuted(!isMuted);
        muteIcon.classList.toggle('fa-volume-up', isMuted);
        muteIcon.classList.toggle('fa-volume-mute', !isMuted);
      });

      volumeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        player.setVolume(val);
        muteIcon.classList.toggle('fa-volume-up', val > 0);
        muteIcon.classList.toggle('fa-volume-mute', val === 0);
      });

      document.getElementById('btn-fullscreen').addEventListener('click', () => {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.documentElement.requestFullscreen();
        }
      });

      document.getElementById('btn-chromecast').addEventListener('click', () => {
        if (window.cast && window.cast.framework) {
          cast.framework.CastContext.getInstance().requestSession();
        }
      });
    })();
  </script>

</body>
</html>
