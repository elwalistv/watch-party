<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Stream - elwalis.com</title>
  
  <!-- SDK del Reproductor de Amazon IVS -->
  <script src="https://live-video.net"></script>

  <!-- Importar Fuentes de Íconos (FontAwesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .layout-container {
      display: flex;
      flex-wrap: wrap;
      height: 100vh;
    }
    .main-content {
      flex: 3;
      display: flex;
      flex-direction: column;
      min-width: 300px;
    }
    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    video {
      width: 100%;
      height: 100%;
    }
    .social-links {
      padding: 15px 20px;
      background: #18181c;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    .social-btn {
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .social-btn:hover {
      transform: translateY(-2px);
    }

    /* Estilos y Efecto de Brillo (Neón) por cada plataforma */
    .btn-youtube { 
      background-color: #ff0000; 
      color: #fff; 
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
    }
    .btn-youtube:hover { box-shadow: 0 0 18px rgba(255, 0, 0, 0.8); }

    .btn-kick { 
      background-color: #53fc18; 
      color: #000; 
      box-shadow: 0 0 12px rgba(83, 252, 24, 0.5);
    }
    .btn-kick:hover { box-shadow: 0 0 18px rgba(83, 252, 24, 0.8); }

    .btn-patreon { 
      background-color: #ff424d; 
      color: #fff; 
      box-shadow: 0 0 12px rgba(255, 66, 77, 0.5);
    }
    .btn-patreon:hover { box-shadow: 0 0 18px rgba(255, 66, 77, 0.8); }

    .btn-twitch { 
      background-color: #9146FF; 
      color: #fff; 
      box-shadow: 0 0 12px rgba(145, 70, 255, 0.5);
    }
    .btn-twitch:hover { box-shadow: 0 0 18px rgba(145, 70, 255, 0.8); }

    .chat-container {
      flex: 1;
      min-width: 340px;
      border-left: 1px solid #2d2d34;
      background: #19191c;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="layout-container">
    <!-- Sección Izquierda: Video + Redes -->
    <div class="main-content">
      <div class="video-container">
        <video id="video-player" controls playsinline></video>
      </div>
      <div class="social-links">
        <!-- Botón YouTube -->
        <a href="https://youtube.com/@TU_USUARIO" target="_blank" class="social-btn btn-youtube">
          <i class="fa-brands fa-youtube"></i> YouTube
        </a>
        
        <!-- Botón Kick -->
        <a href="https://kick.com/TU_USUARIO" target="_blank" class="social-btn btn-kick">
          <i class="fa-solid fa-k"></i> Suscribirse
        </a>
        
        <!-- Botón Patreon -->
        <a href="https://patreon.com/TU_USUARIO" target="_blank" class="social-btn btn-patreon">
          <i class="fa-brands fa-patreon"></i> Patreon
        </a>

        <!-- Botón Twitch -->
        <a href="https://twitch.tv/TU_USUARIO" target="_blank" class="social-btn btn-twitch">
          <i class="fa-brands fa-twitch"></i> Suscribirse <i class="fa-solid fa-video" style="font-size: 11px; opacity: 0.8;"></i>
        </a>
      </div>
    </div>

    <!-- Sección Derecha: Chat Incrustado de Kick -->
    <div class="chat-container">
      <iframe src="https://kick.com/popout/TU_USUARIO/chat"></iframe>
    </div>
  </div>

  <script>
    (function() {
      if (!IVSPlayer.isPlayerSupported) {
        console.error("El reproductor de Amazon IVS no es compatible con este navegador.");
        return;
      }
      const player = IVSPlayer.create();
      player.attachHTMLVideoElement(document.getElementById('video-player'));
      
      // RECUERDA COLOCAR TU URL DE REPRODUCCIÓN DE AWS IVS AQUÍ:
      const playbackUrl = "https://TU_ID_PLAYBACK.codes.us-east-1.playback.live-video.net/api/video/v1/us-east-1.CUENTA.channel.M3U8_ID.m3u8";
      
      player.load(playbackUrl);
      player.play();
    })();
  </script>

</body>
</html>
