<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - ElWalis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Contenedor principal que mantiene proporción y permite ocultar elementos de Kick */
        .wrapper {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 15px;
            width: 95vw;
            height: 90vh;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #000;
            border-radius: 12px;
            overflow: hidden; /* CORTA LOS ELEMENTOS DE KICK */
        }

        /* Zoom para que los logos y botones de Kick queden fuera del cuadro */
        #kick-iframe {
            position: absolute;
            top: -2%;
            left: -2%;
            width: 104%;
            height: 104%;
            border: 0;
        }

        /* Capa invisible que bloquea el clic hacia la web de Kick */
        .mouse-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 5;
            pointer-events: auto;
        }

        /* Contenedor del Chat */
        .chat-container {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
        }

        #chat-iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Diseño responsivo */
        @media (max-width: 900px) {
            .wrapper { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="left-column">
            <div class="video-container" id="videoBox">
                <!-- REEMPLAZA eltopo12345 por tu usuario -->
                <iframe 
                    id="kick-iframe"
                    src="https://player.kick.com/eltopo12345?autoplay=true&muted=false" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
                <!-- Escudo invisible para evitar redirecciones -->
                <div class="mouse-blocker"></div>
            </div>
        </div>

        <div class="chat-container">
            <iframe id="chat-iframe" src="https://kick.com/popout/eltopo12345/chat"></iframe>
        </div>
    </div>

</body>
</html>
