<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party ElWalis</title>
    <style>
        /* ESTILOS CSS: Pantalla completa y diseño limpio estilo Jivencio */
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Fondo negro elegante */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Truco para recortar la barra de título superior de YouTube */
        #yt-player {
            position: absolute;
            top: -60px;
            left: 0;
            width: 100%;
            height: calc(100% + 120px);
            pointer-events: auto;
        }

        /* Capa transparente que bloquea el mouse para que no aparezcan los controles de YouTube */
        .mouse-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            pointer-events: auto;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Contenedor donde se insertará el reproductor de YouTube -->
        <div id="yt-player"></div>
        
        <!-- Bloqueador de interacción para evitar que vean o toquen los controles -->
        <div class="mouse-blocker"></div>
    </div>

    <!-- SCRIPT DE LA API DE YOUTUBE -->
    <script>
        // ID de tu transmisión actual en YouTube
        var myVideoId = 'eUlnicOwdc4'; 

        // Carga la API de YouTube de forma dinámica
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;

        // Se ejecuta automáticamente cuando la API de YouTube carga
        function onYouTubeIframeApiReady() {
            player = new YT.Player('yt-player', {
                videoId: myVideoId,
                playerVars: {
                    'autoplay': 1,          // Forzar reproducción automática
                    'controls': 0,          // Ocultar controles nativos
                    'showinfo': 0,          // Ocultar información
                    'modestbranding': 1,    // Minimizar logo de YouTube
                    'rel': 0,               // Evitar videos relacionados al final
                    'loop': 1,              // Mantener en bucle
                    'playlist': myVideoId,
                    'iv_load_policy': 3     // Ocultar anotaciones
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        // Cuando el reproductor está listo para funcionar
        function onPlayerReady(event) {
            // Nota: Los navegadores modernos exigen silenciar para el autoplay inicial garantizado
            event.target.mute(); 
            event.target.playVideo();
        }

        // Control de estados por si el stream se pausa o termina
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                player.playVideo();
            }
        }

        // Manejo de errores de carga por si la transmisión tarda en conectar
        function onPlayerError(event) {
            console.log("Error en el reproductor de YouTube, codigo: ", event.data);
        }
    </script>

</body>
</html>
