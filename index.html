<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elwalis.com - Watch Party</title>
    <!-- Importar reproductor Amazon IVS -->
    <script src="https://player.live-video.net/1.24.0/amazon-ivs-player.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0e0e10;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Barra superior de meta general (Tipo banner superior) */
        .top-banner {
            background: #18181b;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2f2f35;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 30;
        }
        .top-banner span {
            color: #ff75e6;
        }

        /* Layout central dividido: Video a la izquierda, Chat a la derecha */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            flex: 1;
            height: calc(100vh - 105px); /* Descontando banner superior e inferior */
            width: 100vw;
        }

        /* Contenedor del video principal con los textos superpuestos y barra inferior */
        .video-section {
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #amazon-ivs-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Texto / Overlay superior izquierdo sobre el video (Ej: Ranking de Animes) */
        .video-overlay-text {
            position: absolute;
            top: 40px;
            left: 40px;
            color: #fff;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 5;
        }

        /* Texto / Overlay inferior izquierdo sobre el video (Ej: 3 SUBS DE KICK = 1 CAP) */
        .video-overlay-bottom-left {
            position: absolute;
            bottom: 60px;
            left: 30px;
            color: #ff75e6;
            font-weight: 900;
            font-size: 24px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 5;
            line-height: 1.2;
        }

        /* Overlay inferior central (Ej: KIMETSU TEMP 3 CAP 6/8) */
        .video-overlay-center {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff9eee;
            font-weight: 900;
            font-size: 28px;
            text-align: center;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 5;
            line-height: 1.2;
        }

        /* Cámara flotante del streamer abajo a la derecha del video */
        .floating-cam {
            position: absolute;
            bottom: 60px;
            right: 30px;
            width: 260px;
            aspect-ratio: 16/9;
            background: #18181b;
            border: 2px solid #53fc18;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .floating-cam span {
            font-size: 13px;
            color: #efeff1;
            background: rgba(0, 0, 0, 0.75);
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* Panel de Chat Lateral Derecho */
        .chat-section {
            background: #18181b;
            border-left: 1px solid #2f2f35;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-header {
            padding: 12px 16px;
            font-weight: 700;
            font-size: 14px;
            border-bottom: 1px solid #2f2f35;
            background: #1f1f23;
            color: #efeff1;
            text-align: center;
        }
        .chat-frame-container {
            flex: 1;
            width: 100%;
            background: #0e0e10;
        }
        .chat-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Barra de botones inferior estilo plataforma (YouTube, Suscribirse, Patreon, etc.) */
        .footer-buttons-bar {
            height: 45px;
            background: #09090b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-top: 1px solid #2f2f35;
            z-index: 30;
            padding: 0 15px;
        }
        .btn-link {
            background: #1f1f23;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #2f2f35;
            transition: background 0.2s;
        }
        .btn-link:hover {
            background: #2f2f35;
        }
        .btn-youtube { background: #ff0000; border-color: #ff0000; }
        .btn-kick { background: #53fc18; color: #000; border-color: #53fc18; font-weight: 700; }
        .btn-patreon { background: #ff424d; border-color: #ff424d; }

        /* Responsividad para móviles */
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                grid-template-rows: 55vh 1fr;
            }
            .floating-cam {
                width: 130px;
                bottom: 45px;
                right: 15px;
            }
            .video-overlay-bottom-left { font-size: 14px; bottom: 45px; left: 15px; }
            .video-overlay-center { font-size: 16px; bottom: 45px; }
        }
    </style>
</head>
<body>

    <!-- Banner Superior de Metas -->
    <div class="top-banner">
        <span>🎬</span> META CASTILLO INFINITO 19/25 SUBS KICK
    </div>

    <!-- Layout Central: Video y Chat -->
    <div class="main-layout">
        
        <!-- Columna Izquierda: Video Principal y Overlays -->
        <div class="video-section">
            <!-- Reproductor Amazon IVS -->
            <video id="amazon-ivs-video" playsinline controls autoplay></video>
            
            <!-- Overlay superior izquierdo (Opcional para tus textos o rankings) -->
            <div class="video-overlay-text">
                <!-- Puedes colocar aquí tus indicadores internos -->
            </div>

            <!-- Textos informativos inferiores flotantes sobre el video -->
            <div class="video-overlay-bottom-left">
                3 SUBS DE KICK = 1 CAP<br>
                <span style="font-size: 18px; color: #fff;">0/9 SUBS = 0/3 CAPS</span>
            </div>

            <div class="video-overlay-center">
                KIMETSU<br>TEMP 3<br>CAP 6/8
            </div>

            <!-- Cámara flotante del streamer abajo a la derecha -->
            <div class="floating-cam">
                <span>Tu Cámara</span>
            </div>
        </div>

        <!-- Columna Derecha: Chat Lateral -->
        <div class="chat-section">
            <div class="chat-header">Chat</div>
            <div class="chat-frame-container">
                <!-- Reemplaza con tu enlace de chat integrado -->
                <iframe src="https://kick.com/popout/elwalistv/chat" title="Chat en vivo"></iframe>
            </div>
        </div>

    </div>

    <!-- Barra Inferior de Botones de Redes / Donaciones -->
    <div class="footer-buttons-bar">
        <a href="https://youtube.com" target="_blank" class="btn-link btn-youtube">YouTube</a>
        <a href="https://kick.com" target="_blank" class="btn-link btn-kick">Suscribirse (Kick)</a>
        <a href="https://patreon.com" target="_blank" class="btn-link btn-patreon">Patreon</a>
        <a href="https://kick.com" target="_blank" class="btn-link">Suscribirse</a>
    </div>

    <!-- Script del Reproductor de Amazon IVS -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (IVISPlayer.isSupported) {
                const player = IVISPlayer.create();
                player.attachHTMLVideoElement(document.getElementById('amazon-ivs-video'));
                
                // Tu URL exacta de reproducción de Amazon IVS
                player.load("https://7c37b557078d.us-east-1.playback.live-video.net/api/video/v1/us-east-1.885191629510.channel.LV8ooIxv5Uqu.m3u8");
                
                player.setVolume(0.8);
                player.play();
            }
        });
    </script>
</body>
</html>
